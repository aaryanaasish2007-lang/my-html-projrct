<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Independence Day Special</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        /* First screen */
        #startScreen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                to bottom,
                #ff9933 0%,
                #ff9933 33.33%,
                white 33.33%,
                white 66.66%,
                #138808 66.66%,
                #138808 100%
            );
        }

        #startButton {
            padding: 18px 35px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: #000080;
            border: 3px solid white;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #startButton:hover {
            transform: scale(1.08);
            background: #0000aa;
        }

        /* Generated page */
        #independencePage {
            display: none;
            min-height: 100vh;
            padding: 25px 15px;

            background: linear-gradient(
                to bottom,
                #ff9933 0%,
                #ff9933 25%,
                #ffffff 25%,
                #ffffff 75%,
                #138808 75%,
                #138808 100%
            );
        }

        h4 {
            font-size: 28px;
            font-weight: bold;
            text-decoration: underline;
            color: #000080;
            margin-top: 20px;
        }

        .flag {
            width: 300px;
            height: 180px;
            margin: 30px auto;
            border: 3px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .saffron {
            height: 60px;
            background: #ff9933;
        }

        .white {
            height: 60px;
            background: white;
            position: relative;
        }

        .green {
            height: 60px;
            background: #138808;
        }

        /* Ashoka Chakra */
        .chakra {
            position: absolute;
            width: 52px;
            height: 52px;
            border: 4px solid #000080;
            border-radius: 50%;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
        }

        .chakra::before {
            content: "";
            position: absolute;
            width: 4px;
            height: 48px;
            background: #000080;
            left: 20px;
            top: -2px;
        }

        .chakra::after {
            content: "";
            position: absolute;
            width: 48px;
            height: 4px;
            background: #000080;
            left: -2px;
            top: 20px;
        }

        .vande {
            font-size: 50px;
            color: #000080;
            font-weight: bold;
            margin: 35px 0 20px;
            text-shadow: 2px 2px 4px #777;
        }

        .wishCard {
            max-width: 700px;
            margin: 20px auto;
            padding: 30px;
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            border: 5px solid #ff9933;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .wishCard h2 {
            color: #ff6600;
            margin-bottom: 15px;
        }

        #wish {
            font-size: 22px;
            line-height: 1.6;
            color: #222;
            font-weight: bold;
        }

        .jai {
            margin-top: 25px;
            font-size: 30px;
            font-weight: bold;
            color: #138808;
        }

        .footer {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #000080;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            animation: fall 4s linear forwards;
            z-index: 999;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body style="text-align: center;">

    <!-- Button Screen -->
    <div id="startScreen">
        <button id="startButton" onclick="generatePage()">
            🇮🇳 Click Here for Independence Day 🇮🇳
        </button>
    </div>


    <!-- Generated Independence Day Page -->
    <div id="independencePage">

        <h5>
            Welcome to 79th Independence Day
        </h5>

        <!-- Indian Flag -->
        <div class="flag">
            <div class="saffron"></div>

            <div class="white">
                <div class="chakra"></div>
            </div>

            <div class="green"></div>
        </div>


        <!-- Main Heading -->
        <h2 class="vande">
            VANDE MATARAM
        </h2>


        <!-- Wishes Card -->
        <div class="wishCard">

            <h2>🇮🇳 Happy Independence Day 🇮🇳</h2>

            <p id="wish"></p>

            <div class="jai">
                JAI HIND! 🇮🇳
            </div>

        </div>


        <div class="footer">
            Proud to be an Indian ❤️🤍💚
        </div>

    </div>


    <script>

        function generatePage() {

            // Hide starting screen
            document.getElementById("startScreen").style.display = "none";

            // Show Independence Day page
            document.getElementById("independencePage").style.display = "block";

            // Generate the wish using JavaScript
            let wishes = [
                "May our nation always shine with freedom, peace and prosperity. Wishing you a very Happy Independence Day!",
                
                "Let us remember the sacrifices of our freedom fighters and celebrate the spirit of freedom. Happy Independence Day!",
                
                "May the tricolor always fly high and fill every Indian heart with pride. Happy Independence Day!",
                
                "Freedom is precious. Let us respect our nation and work together to make India stronger. Jai Hind!"
            ];

            // Select a random wish
            let randomNumber = Math.floor(Math.random() * wishes.length);

            document.getElementById("wish").innerHTML =
                wishes[randomNumber];

            // Create confetti
            createConfetti();
        }


        function createConfetti() {

            let colors = [
                "#ff9933",
                "#ffffff",
                "#138808",
                "#000080"
            ];

            for (let i = 0; i < 100; i++) {

                let confetti = document.createElement("div");

                confetti.classList.add("confetti");

                confetti.style.left =
                    Math.random() * 100 + "vw";

                confetti.style.backgroundColor =
                    colors[Math.floor(Math.random() * colors.length)];

                confetti.style.animationDuration =
                    (Math.random() * 3 + 2) + "s";

                confetti.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(confetti);

                // Remove confetti after animation
                setTimeout(function() {
                    confetti.remove();
                }, 6000);
            }
        }

    </script>
<h6 style="text-align: right;"> Created By </h6>
<h5 style="text-align:right;"> D. Aaryan Aasish </h5>
</body>
</html>
